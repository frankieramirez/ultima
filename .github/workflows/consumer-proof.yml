name: Installed consumer proof

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates and cost in docs/spec/consumer-proof.md: a pull request runs the cells its change plan selects,
  # and a push or a scheduled run, which has no pull-request base, runs every cell.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proof: ${{ steps.select.outputs.proof }}
      mode: ${{ steps.select.outputs.mode }}
      copy: ${{ steps.select.outputs.copy }}
      lint: ${{ steps.select.outputs.lint }}
      bundles: ${{ steps.select.outputs.bundles }}
      elements: ${{ steps.select.outputs.elements }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/consumer-select.ts "$BASE" >> "$GITHUB_OUTPUT"

  consumer-proof:
    needs: select
    if: ${{ needs.select.outputs.proof != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.proof) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production installed consumer
        run: node --experimental-strip-types scripts/consumer-proof.ts --layout "${{ matrix.layout }}" --delivery-path "${{ matrix.delivery-path }}" --output "$RUNNER_TEMP/consumer-proof"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-proof-${{ matrix.layout }}-${{ matrix.delivery-path }}
          path: ${{ runner.temp }}/consumer-proof
          if-no-files-found: error
          retention-days: 90

  theme-mode:
    needs: select
    if: ${{ needs.select.outputs.mode != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.mode) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production installed theme mode
        run: node --experimental-strip-types scripts/consumer-proof.ts --layout "${{ matrix.layout }}" --delivery-path css --exercise theme-mode --output "$RUNNER_TEMP/consumer-proof"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-proof-${{ matrix.layout }}-theme-mode
          path: ${{ runner.temp }}/consumer-proof
          if-no-files-found: error
          retention-days: 90

  copy-bundles:
    needs: select
    if: ${{ needs.select.outputs.copy != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.copy) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production installed copy bundles
        run: node --experimental-strip-types scripts/consumer-proof.ts --layout "${{ matrix.layout }}" --delivery-path css --exercise copy-bundles --output "$RUNNER_TEMP/consumer-proof"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-proof-${{ matrix.layout }}-copy-bundles
          path: ${{ runner.temp }}/consumer-proof
          if-no-files-found: error
          retention-days: 90

  lint:
    needs: select
    if: ${{ needs.select.outputs.lint != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.lint) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installed StyleX lint
        run: node --experimental-strip-types scripts/consumer-proof.ts --layout "${{ matrix.layout }}" --delivery-path css --exercise lint --output "$RUNNER_TEMP/consumer-proof"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-proof-${{ matrix.layout }}-lint
          path: ${{ runner.temp }}/consumer-proof
          if-no-files-found: error
          retention-days: 90

  bundles:
    needs: select
    if: ${{ needs.select.outputs.bundles != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.bundles) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Production bundles in three engines
        run: node --experimental-strip-types scripts/consumer-proof.ts --layout "${{ matrix.layout }}" --delivery-path css --exercise bundles --output "$RUNNER_TEMP/consumer-proof"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-proof-${{ matrix.layout }}-bundles
          path: ${{ runner.temp }}/consumer-proof
          if-no-files-found: error
          retention-days: 90

  elements:
    needs: select
    if: ${{ needs.select.outputs.elements != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Element lifecycle in three engines
        run: node --experimental-strip-types scripts/consumer-proof.ts --layout vite --delivery-path css --exercise elements --output "$RUNNER_TEMP/consumer-proof"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-proof-vite-elements
          path: ${{ runner.temp }}/consumer-proof
          if-no-files-found: error
          retention-days: 90

  matrix:
    needs: [select, consumer-proof, theme-mode, copy-bundles, lint, bundles, elements]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.select.outputs.bundles != '[]' || needs.select.outputs.elements != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-proof-*-{bundles,elements}
          path: ${{ runner.temp }}/reports
      - name: One revision, every matrix cell
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/consumer-matrix.ts "$RUNNER_TEMP/reports" --summary "$RUNNER_TEMP/matrix.md"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-matrix
          path: |
            ${{ runner.temp }}/matrix.md
            ${{ runner.temp }}/matrix.json
          if-no-files-found: warn
          retention-days: 90
      - name: File the scheduled failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/consumer-matrix.ts --file-issue "$RUNNER_TEMP/matrix.md"
