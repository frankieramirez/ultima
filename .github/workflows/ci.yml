name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Catalogue freshness
        run: pnpm catalogue:check

      - name: Architecture
        run: pnpm check:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm --filter @ultima/ui exec playwright install --with-deps chromium
          pnpm test

      - name: Contrast gate
        run: python3 packages/tokens/scripts/palette.py --check

      - name: Registry build
        run: pnpm registry:build

      - name: Docs build
        run: pnpm --filter @ultima/docs build
