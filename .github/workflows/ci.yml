name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Catalogue freshness
        run: pnpm catalogue:check

      - name: Architecture
        run: pnpm check:architecture

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm test` without the tooling, analysis and docs suites, which run beside this job in the
      # `tooling`, `analysis` and `docs` jobs. The filter names `packages/*` because a filter with only
      # exclusions also selects the workspace root, whose own `test` script runs every suite again.
      - name: Test
        run: |
          pnpm --filter @ultima/ui exec playwright install --with-deps chromium
          pnpm -r --filter './packages/*' --filter '!@ultima/analysis' test

      - name: Contrast gate
        run: python3 packages/tokens/scripts/palette.py --check

      - name: Registry build
        run: pnpm registry:build

      - name: Docs build
        run: pnpm --filter @ultima/docs build

  # The catalogue and verification node:test suites, which `pnpm test` runs before the packages.
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Chromium
        run: pnpm --filter @ultima/ui exec playwright install --with-deps chromium

      - name: Tooling tests
        run: node --experimental-strip-types --test scripts/catalogue/*.test.ts scripts/verification/*.test.ts

  # The architecture checker's fixtures. Each test runs the checker over the whole repository, so this
  # is the slowest package suite, and inside `pnpm -r test` it held back every package in the dependency
  # level after its own.
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Analysis tests
        run: pnpm --filter @ultima/analysis test

  # The docs Vitest suite, the slowest in `pnpm test`, split by file across four runners. Each shard
  # runs the package's own test script, so the catalogue preflight and the registry build still precede it.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Chromium
        run: pnpm --filter @ultima/docs exec playwright install --with-deps chromium

      - name: Docs tests
        run: pnpm --filter @ultima/docs test --shard=${{ matrix.shard }}/4

  # The one result the `main` ruleset requires beside `production`: green only when the build and every
  # suite job passed, so splitting the suites across jobs loses none of them from the gate.
  check:
    if: ${{ always() }}
    needs: [build, tooling, analysis, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test -z "$(printf '%s\n' $RESULTS | grep -vx success)"

  # The full production matrix on every pull request and push to main, against this job's own
  # production docs build: docs/spec/agent-infrastructure.md, Local, PR and release policy. No path
  # filter. `test:production` snapshots the checkout, installs, builds and runs every registered case in
  # one run, so no build crosses a job boundary. The gate then rejects an absent report, an unavailable
  # prerequisite, a skipped cell or a registered cell the report never planned or executed.
  #
  # Limits, per State, readiness and deadlines: 15 minutes for preparation and the build plus 10 for the
  # matrix is 25; the run's deadline adds 5 for the snapshot's install. The job adds 10 for setup ahead
  # of the run and 5 for the gate, the upload and teardown. A warm local run took 53 seconds (#464).
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Chromium
        run: pnpm --filter @ultima/docs exec playwright install --with-deps chromium

      - name: Production matrix
        run: pnpm --filter @ultima/docs test:production --output "$RUNNER_TEMP/production" --timeout 1800

      - name: Production gate
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types apps/docs/scripts/production-gate.ts "$RUNNER_TEMP/production" --head "$GITHUB_SHA"

      # The report, logs and per-cell images and traces, on success and failure. The snapshot's source
      # directory is dropped after the run and never uploaded.
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-report
          path: |
            ${{ runner.temp }}/production
            !${{ runner.temp }}/production/source/**
          if-no-files-found: warn
          retention-days: 7
