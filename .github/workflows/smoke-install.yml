name: Smoke install

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'registry/static/**'
      - 'registry/items.config.ts'
      - 'registry/metadata/**'
      - 'scripts/catalogue/**'
      - 'scripts/build-registry.ts'
      - 'scripts/build-agent-guide.ts'
      - 'scripts/smoke-install.sh'
      - 'packages/cli/**'
      - 'packages/ui/src/**'
      - 'packages/tokens/**'
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/smoke-install.yml'

jobs:
  smoke-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # mktemp honours TMPDIR, so the consumer apps land somewhere the upload
      # step can name.
      - name: Smoke install
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          TMPDIR="$RUNNER_TEMP/smoke" ./scripts/smoke-install.sh --keep

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-install-apps
          path: |
            ${{ runner.temp }}/smoke
            !${{ runner.temp }}/smoke/**/node_modules/**
          retention-days: 7
